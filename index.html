<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(() => {
'use strict';
const KEY='workpay_local_v1';
const THEME_KEY='mbpaystub_theme_v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const defaultState=()=>({version:1,settings:{jobName:'My job',hourlyRate:20,payFrequency:'biweekly',payday:5,weekStarts:1,otThreshold:40,otMultiplier:1.5,doubleThreshold:0,doubleMultiplier:2,shiftDiff:0,state:'NH',filing:'single',extraWithholding:0,pretaxDeductions:0,posttaxDeductions:0,workweekStart:'2026-01-05',currency:'USD',reminders:false},shifts:[],paystubs:[],jobs:[],activeShift:null,createdAt:new Date().toISOString()});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){state=defaultState()}
let page='home',editingId=null,editingJobId=null,toastTimer=null;
// Jobs: each job keeps its own name, rate, differential and active/past status. Shifts reference jobs by name.
function ensureJobs(){
 if(!Array.isArray(state.jobs))state.jobs=[];
 const s=state.settings,names=new Set(state.jobs.map(j=>j.name));
 const add=(name,rate,diff)=>{if(name&&!names.has(name)){state.jobs.push({id:uid(),name,rate:Number(rate)||0,differential:Number(diff)||0,active:true});names.add(name)}};
 if(!state.jobs.length)add(s.jobName||'My job',s.hourlyRate,s.shiftDiff);
 for(const sh of state.shifts)add(sh.job||s.jobName,sh.rate,sh.differential);
 for(const st of state.paystubs)add(st.employer,s.hourlyRate,0);
 for(const j of state.jobs){j.payFrequency??=s.payFrequency||'biweekly';j.weekStarts??=Number(s.weekStarts??1);if(j.anchor===undefined)j.anchor=s.workweekStart||'';j.payday??='';j.otThreshold??=Number(s.otThreshold??40);j.otMultiplier??=Number(s.otMultiplier??1.5)}
 if(!state.jobs.some(j=>j.name===s.jobName&&j.active))s.jobName=(state.jobs.find(j=>j.active)||state.jobs[0]).name;
}
ensureJobs();
function jobByName(n){return state.jobs.find(j=>j.name===n)}
function activeJobs(){return state.jobs.filter(j=>j.active)}
function jobOptions(selected,includePast=true){return (includePast?state.jobs:activeJobs()).map(j=>`<option value="${esc(j.name)}" ${j.name===selected?'selected':''}>${esc(j.name)}${j.active?'':' (past job)'}</option>`).join('')}
function syncDefaultJob(){const j=jobByName(state.settings.jobName);if(j){state.settings.hourlyRate=j.rate;state.settings.shiftDiff=j.differential||0}}
function jobSelect(label,name,value,includePast=true){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${jobOptions(value,includePast)}</select></div>`}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const FREQ={weekly:'Weekly',biweekly:'Every two weeks',semimonthly:'Twice a month',monthly:'Monthly'};
// Pay schedule + overtime rules for a job (falls back to the default job).
function jobCfg(name){const j=jobByName(name)||jobByName(state.settings.jobName)||state.jobs[0]||{};const n=(v,d)=>v===''||v==null||isNaN(Number(v))?d:Number(v);return {name:j.name,payFrequency:j.payFrequency||'biweekly',weekStarts:n(j.weekStarts,1),anchor:j.anchor||'',payday:j.payday||'',otThreshold:Math.max(0,n(j.otThreshold,40)),otMultiplier:Math.max(1,n(j.otMultiplier,1.5))}}
function nextPayday(name){const c=jobCfg(name);if(!c.payday||c.payFrequency==='semimonthly')return '';const t=today(),now=new Date(t+'T12:00:00'),p=new Date(c.payday+'T12:00:00');if(isNaN(p))return '';
 if(c.payFrequency==='monthly'){const day=p.getDate();for(let k=0;k<2;k++){const y=now.getFullYear(),mo=now.getMonth()+k,last=new Date(y,mo+1,0).getDate(),x=ymd(new Date(y,mo,Math.min(day,last)));if(x>=t)return x}return ''}
 const step=c.payFrequency==='weekly'?7:14,k=Math.ceil(Math.round((now-p)/86400000)/step);p.setDate(p.getDate()+k*step);return ymd(p)}
// Each job's current pay period, its shifts in that period, and totals.
function jobPeriods(date=today()){return state.jobs.map(j=>{const range=periodRange(date,j.name),shifts=state.shifts.filter(s=>(s.job||state.settings.jobName)===j.name&&inRange((s.start||'').slice(0,10),range.start,range.end));return {job:j,range,shifts,t:totals(shifts)}}).filter(p=>p.job.active||p.shifts.length)}
function rangeLabel(jp){const set=[...new Set(jp.filter(p=>p.shifts.length||p.job.name===state.settings.jobName).map(p=>p.range.start+'|'+p.range.end))];if(set.length===1){const [a,b]=set[0].split('|');return `${dateFmt(a)} – ${dateFmt(b)}`}return 'Varies by job'}
// Each employer withholds on its own paycheck, so take-home is estimated per job; deductions apply to the default job's check.
function periodNet(jp){const out={net:0,fed:0,stateTax:0,fica:0};for(const p of jp){const isDef=p.job.name===state.settings.jobName;if(!p.t.gross&&!isDef)continue;const n=estimateNet(p.t.gross,p.job.name,isDef);out.net+=n.net;out.fed+=n.fed;out.stateTax+=n.stateTax;out.fica+=n.fica}return out}
function applyTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_KEY,theme)}catch(e){}const b=$('#themeToggle');if(b){b.textContent=theme==='dark'?'☀ Light':'◐ Dark';b.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode')}}
try{applyTheme(localStorage.getItem(THEME_KEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){applyTheme('light')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notify('Could not save: browser storage may be full. Export a backup.');}}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:state.settings.currency||'USD'}).format(Number(n)||0)}
function dateFmt(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function dtLocalValue(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function toDate(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function hoursBetween(start,end){let a=toDate(start),b=toDate(end);return a&&b?Math.max(0,(b-a)/3600000):0}
function shiftHours(s){let raw=hoursBetween(s.start,s.end||new Date());return Math.max(0,raw-(Number(s.unpaidBreak)||0)/60)}
function weekStartDate(dateStr,starts=1){let d=new Date((dateStr||today())+'T12:00:00');let delta=(d.getDay()-Number(starts)+7)%7;d.setDate(d.getDate()-delta);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekEndFromStart(start){let d=new Date(start+'T12:00:00');d.setDate(d.getDate()+6);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function inRange(date,a,b){return date>=a&&date<=b}
function periodRange(date=today(),jobName=state.settings.jobName){const c=jobCfg(jobName),d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();let start,end;
 if(c.payFrequency==='weekly'){start=weekStartDate(date,c.weekStarts);end=weekEndFromStart(start)}
 else if(c.payFrequency==='biweekly'){const first=state.shifts.filter(s=>(s.job||state.settings.jobName)===c.name&&s.start).map(s=>s.start.slice(0,10)).sort()[0];const a=new Date((c.anchor||weekStartDate(first||date,c.weekStarts))+'T12:00:00');a.setDate(a.getDate()+Math.floor(Math.round((d-a)/86400000)/14)*14);start=ymd(a);a.setDate(a.getDate()+13);end=ymd(a)}
 else if(c.payFrequency==='monthly'){start=ymd(new Date(y,m,1));end=ymd(new Date(y,m+1,0))}
 else if(d.getDate()<=15){start=ymd(new Date(y,m,1));end=ymd(new Date(y,m,15))}else{start=ymd(new Date(y,m,16));end=ymd(new Date(y,m+1,0))}
 return {start,end};
}
function shiftPay(s){const settings=state.settings,c=jobCfg(s.job||settings.jobName);
 const h=shiftHours(s),rate=Number(s.rate??settings.hourlyRate)||0,diff=Number(s.differential??settings.shiftDiff)||0;
 const otLimit=c.otThreshold,mult=c.otMultiplier;
 // Federal-style weekly OT model: overtime is counted per employer, so only shifts for the same job in the same workweek are grouped.
 const week=weekStartDate((s.start||'').slice(0,10),c.weekStarts),jobKey=s.job||settings.jobName;
 const group=state.shifts.filter(x=>(x.job||settings.jobName)===jobKey&&weekStartDate((x.start||'').slice(0,10),c.weekStarts)===week).slice().sort((a,b)=>a.start.localeCompare(b.start));
 let before=0, regular=0, overtime=0;
 for(const x of group){let hx=shiftHours(x),lim=Math.max(0,otLimit-before),reg=Math.min(hx,lim),ot=Math.max(0,hx-reg);if(x.id===s.id){regular=reg;overtime=ot;break}before+=hx}
 if(!s.id){regular=Math.min(h,Math.max(0,otLimit-before));overtime=Math.max(0,h-regular)}
 const base=regular*rate, otPay=overtime*rate*mult, differential=h*diff;
 return {hours:h,regular,overtime,base,otPay,differential,gross:base+otPay+differential};
}
function totals(shifts){let hours=0,reg=0,ot=0,gross=0;for(const s of shifts){let p=shiftPay(s);hours+=p.hours;reg+=p.regular;ot+=p.overtime;gross+=p.gross}return {hours,reg,ot,gross}}
function allSorted(){return [...state.shifts].sort((a,b)=>(b.start||'').localeCompare(a.start||''))}
function periodShifts(range=periodRange()){return state.shifts.filter(s=>inRange((s.start||'').slice(0,10),range.start,range.end))}
function estimateNet(gross,jobName=state.settings.jobName,withDeductions=true){const s=state.settings,f=jobCfg(jobName).payFrequency,dd=withDeductions?1:0;const taxable=Math.max(0,gross-dd*(Number(s.pretaxDeductions)||0)); // coarse transparent estimate, not payroll-grade
 let fed=0,stateTax=0,fica=taxable*.0765;
 // Annualized rough progressive federal estimate using simplified 2025 single/other brackets, then per-period allocation.
 const annual=taxable*(f==='weekly'?52:f==='biweekly'?26:f==='semimonthly'?24:12);
 const single=s.filing==='married'?{std:31500,br:[23850,96750,206700,394600,501050,751600],rates:[.1,.12,.22,.24,.32,.35,.37]}:{std:15750,br:[11925,48475,103350,197300,250525,626350],rates:[.1,.12,.22,.24,.32,.35,.37]};
 let taxableAnnual=Math.max(0,annual-single.std),tax=0,prev=0;
 for(let i=0;i<single.br.length;i++){let amt=Math.max(0,Math.min(taxableAnnual,single.br[i])-prev);tax+=amt*single.rates[i];prev=single.br[i]}
 if(taxableAnnual>prev)tax+=(taxableAnnual-prev)*single.rates[single.rates.length-1];
 fed=tax/(f==='weekly'?52:f==='biweekly'?26:f==='semimonthly'?24:12);
 const stateRates={NH:0,AK:.02,FL:.02,NV:.02,SD:.02,TN:.02,TX:.02,WA:.02,WY:.02,CT:.045,MA:.05,ME:.05,NY:.055,NJ:.04,CA:.06,PA:.0307};
 stateTax=taxable*(stateRates[s.state]??.04);
 const net=Math.max(0,gross-fed-stateTax-fica-dd*((Number(s.extraWithholding)||0)+(Number(s.posttaxDeductions)||0)));
 return {net,fed,stateTax,fica,taxable,disclaimer:'Rough planning estimate. Simplified federal brackets and state-rate assumptions; not a payroll or tax filing calculation.'};

 <div class="actions"><button data-action="exportJson">Export JSON</button><button data-action="exportCsv">Export shifts CSV</button><button class="primary" data-action="exportZip">Export ZIP bundle</button><label class="filebtn"><button type="button">Import backup…</button><input id="importFile" type="file" accept=".json,.csv,.zip,application/json,text/csv,application/zip"></label><button class="danger" data-action="reset">Erase all local data</button></div>
 <p class="hint">Importing a JSON/ZIP backup replaces the current dataset after confirmation. CSV import adds shift rows. ZIP import requires JSZip to be available; this single-file app loads it from a CDN.</p></section>`;
}
function bindPage(){
 $$('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;editingId=null;render()});
 $$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));
 const sf=$('#shiftForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),id=f.get('id')||uid(),obj={id,start:f.get('start'),end:f.get('end')||null,job:f.get('job'),rate:Number(f.get('rate')),unpaidBreak:Number(f.get('unpaidBreak'))||0,differential:Number(f.get('differential'))||0,notes:f.get('notes')||''};if(obj.end&&new Date(obj.end)<new Date(obj.start)){notify('End time must be after start time.');return}let idx=state.shifts.findIndex(x=>x.id===id);if(idx>=0)state.shifts[idx]=obj;else state.shifts.push(obj);if(state.activeShift?.id===id)state.activeShift=null;editingId=null;save();notify('Shift saved');render()};
 const stf=$('#stubForm');if(stf)stf.onsubmit=e=>{e.preventDefault();const f=new FormData(stf),id=f.get('id')||uid(),obj={id,employer:f.get('employer'),date:f.get('date'),start:f.get('start'),end:f.get('end'),actualGross:Number(f.get('actualGross'))||0,actualNet:Number(f.get('actualNet'))||0,notes:f.get('notes')||''};let i=state.paystubs.findIndex(x=>x.id===id);if(i>=0)state.paystubs[i]=obj;else state.paystubs.push(obj);editingId=null;save();notify('Paystub saved');render()};
 const setf=$('#settingsForm');if(setf)setf.onsubmit=e=>{e.preventDefault();const f=new FormData(setf);for(const k of ['extraWithholding','pretaxDeductions','posttaxDeductions'])state.settings[k]=Number(f.get(k))||0;for(const k of ['state','filing','currency'])state.settings[k]=f.get(k);save();notify('Settings saved');render()};
 const jf=$('#jobForm');if(jf)jf.onsubmit=e=>{e.preventDefault();const f=new FormData(jf),id=f.get('id'),name=String(f.get('jobName')||'').trim(),rate=Number(f.get('jobRate'))||0,differential=Number(f.get('jobDiff'))||0,sched={payFrequency:f.get('jobFreq'),weekStarts:Number(f.get('jobWeek'))||0,payday:f.get('jobPayday')||'',anchor:f.get('jobFreq')==='biweekly'?(f.get('jobAnchor')||''):'',otThreshold:f.get('jobOt')===''?40:Number(f.get('jobOt')),otMultiplier:Math.max(1,Number(f.get('jobOtMult'))||1.5)},makeDef=!!f.get('jobDefault');if(!name){notify('Give the job a name.');return}if(state.jobs.some(j=>j.name===name&&j.id!==id)){notify('You already have a job with that name.');return}
  const existing=state.jobs.find(j=>j.id===id);
  if(existing){const old=existing.name;if(old!==name){state.shifts.forEach(x=>{if((x.job||state.settings.jobName)===old)x.job=name});state.paystubs.forEach(x=>{if(x.employer===old)x.employer=name});if(state.activeShift&&state.activeShift.job===old)state.activeShift.job=name;if(state.settings.jobName===old)state.settings.jobName=name}Object.assign(existing,{name,rate,differential},sched);if(makeDef){existing.active=true;state.settings.jobName=name}}
  else{state.jobs.push({id:uid(),name,rate,differential,active:true,...sched});if(makeDef||activeJobs().length===1)state.settings.jobName=name}
  editingJobId=null;syncDefaultJob();save();notify('Job saved');render()};
 const jfq=$('#jobFreq');if(jfq){const vis=()=>{const v=jfq.value;$('#jobAnchor').closest('.field').classList.toggle('hidden',v!=='biweekly');$('#jobPayday').closest('.field').classList.toggle('hidden',v==='semimonthly')};jfq.onchange=vis;vis()}
 const se=$('#stubForm [name=employer]');if(se&&!$('#stubForm [name=id]').value)se.onchange=()=>{const r=periodRange(today(),se.value);$('#stubForm [name=start]').value=r.start;$('#stubForm [name=end]').value=r.end};
 const sj=$('#shiftForm [name=job]');if(sj)sj.onchange=()=>{const j=jobByName(sj.value);if(j){$('#shiftForm [name=rate]').value=j.rate;$('#shiftForm [name=differential]').value=j.differential||0}};
 const wf=$('#whatifForm');if(wf)wf.onsubmit=e=>{e.preventDefault();const f=new FormData(wf),rate=Number(f.get('whatRate'))||0,reg=Number(f.get('extraHours'))||0,ot=Number(f.get('extraOT'))||0,gross=reg*rate+ot*rate*(Number(f.get('whatMult'))||1.5),net=estimateNet(gross);$('#whatifResult').innerHTML=`<div class="callout">This scenario adds <strong>${money(gross)}</strong> gross, with a rough estimated take-home of <strong>${money(net.net)}</strong>. Net estimate is approximate and should not be treated as a payroll quote.</div>`};
 const imp=$('#importFile');if(imp)imp.onchange=async()=>{if(imp.files[0])await importFile(imp.files[0]);imp.value=''};
}
function action(a,id){
 if(a==='clock'){toggleClock();return}
 if(a==='demoData'){loadDemoData();return}
 if(a==='newJob'){editingJobId='new';render();return}
 if(a==='editJob'){editingJobId=id;render();return}
 if(a==='cancelJob'){editingJobId=null;render();return}
 if(a==='toggleJob'){const j=state.jobs.find(x=>x.id===id);if(!j)return;if(j.active&&activeJobs().length===1){notify('Add your new job first, then mark this one as past.');return}if(j.active&&state.activeShift?.job===j.name){notify('Clock out of this job first.');return}j.active=!j.active;if(!j.active&&state.settings.jobName===j.name)state.settings.jobName=activeJobs()[0].name;syncDefaultJob();save();render();notify(j.active?'Job reactivated':'Marked as past job. History kept.');return}
 if(a==='deleteJob'){const j=state.jobs.find(x=>x.id===id);if(!j)return;if(j.active&&activeJobs().length===1){notify('You need at least one active job.');return}if(confirm(`Delete "${j.name}"? It has no shifts.`)){state.jobs=state.jobs.filter(x=>x.id!==id);ensureJobs();syncDefaultJob();save();render()}return}
 if(a==='newshift'){editingId='new';page='timecard';render();setTimeout(()=>$('#shiftForm')?.scrollIntoView({behavior:'smooth',block:'start'}),20);return}
 if(a==='cancelEdit'){editingId=null;render();return}
 if(a==='editShift'){editingId=id;page='timecard';render();return}
 if(a==='deleteShift'){if(confirm('Delete this shift permanently from this device?')){state.shifts=state.shifts.filter(s=>s.id!==id);save();render();notify('Shift deleted')}return}
 if(a==='newstub'){editingId='new';render();return}
 if(a==='editStub'){editingId=id;render();return}
 if(a==='deleteStub'){if(confirm('Delete this paystub entry?')){state.paystubs=state.paystubs.filter(s=>s.id!==id);save();render()}return}
 if(a==='export'||a==='exportJson'){exportJSON();return}
 if(a==='exportCsv'){exportCSV();return}
 if(a==='exportZip'){exportZIP();return}
 if(a==='reset'){if(confirm('This permanently erases all mbpayday.online data saved in this browser. Export a backup first if you may need it. Continue?')){state=defaultState();save();editingId=null;page='home';render();notify('Local data erased')}return}
}
function loadDemoData(){
 const base=new Date();base.setDate(base.getDate()-6);
 const dates=[];for(let i=0;i<6;i++){const d=new Date(base);d.setDate(d.getDate()+i);dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)}
 const demoTag='DEMO · Sample records';
 const examples=dates.map((day,i)=>{const startHour=i===5?8:8;const hours=i===5?5.5:8;const start=new Date(`${day}T${String(startHour).padStart(2,'0')}:00:00`);const end=new Date(start.getTime()+hours*3600000);const local=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;return{id:uid(),start:local(start),end:local(end),job:'Demo job',rate:22.5,unpaidBreak:i===5?0:30,differential:0.75,notes:demoTag}});
 state.shifts.push(...examples);
 const start=new Date();start.setDate(start.getDate()-13);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const gross=totals(examples).gross;
 state.paystubs.push({id:uid(),employer:'Demo job',date:today(),start:fmt(start),end:today(),actualGross:Math.round((gross+12.5)*100)/100,actualNet:Math.round(gross*.78*100)/100,notes:`${demoTag}. Intentional gross difference added to demonstrate the comparison feature.`});
 ensureJobs();
 save();page='home';editingId=null;render();notify('Demo records added. Existing records were kept.');
}
function toggleClock(){
 if(state.activeShift){const id=state.activeShift.id,shift=state.shifts.find(s=>s.id===id);if(shift){const n=new Date();shift.end=dtLocalValue(n)+':'+String(n.getSeconds()).padStart(2,'0');}state.activeShift=null;save();notify('Clocked out. Shift saved.');render();return}
 const pick=$('#clockJob')?.value,job=jobByName(pick)||jobByName(state.settings.jobName)||activeJobs()[0];
 const n=new Date(),s={id:uid(),start:dtLocalValue(n)+':'+String(n.getSeconds()).padStart(2,'0'),end:null,job:job.name,rate:Number(job.rate)||0,unpaidBreak:0,differential:Number(job.differential)||0,notes:''};state.shifts.push(s);state.activeShift=s;save();notify('Clocked in');render()
}
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportJSON(){const payload={...state,exportedAt:new Date().toISOString(),app:'mbpayday.online'};download(`mbpayday-backup-${today()}.json`,new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));notify('JSON backup exported')}
function csvEscape(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){const cols=['id','start','end','job','rate','unpaidBreak','differential','notes'];let lines=[cols.join(',')];state.shifts.forEach(s=>lines.push(cols.map(k=>csvEscape(s[k])).join(',')));download(`mbpayday-shifts-${today()}.csv`,new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));notify('Shifts CSV exported')}
async function exportZIP(){const data={...state,exportedAt:new Date().toISOString(),app:'mbpayday.online'};if(!window.JSZip){notify('ZIP library unavailable. Use JSON export or reconnect to load ZIP support.');return}try{const zip=new JSZip();zip.file('mbpayday-backup.json',JSON.stringify(data,null,2));const cols=['id','start','end','job','rate','unpaidBreak','differential','notes'];zip.file('shifts.csv','\ufeff'+[cols.join(','),...state.shifts.map(s=>cols.map(k=>csvEscape(s[k])).join(','))].join('\r\n'));zip.file('paystubs.csv','\ufeff'+[['id','employer','date','start','end','actualGross','actualNet','notes'].join(','),...state.paystubs.map(s=>['id','employer','date','start','end','actualGross','actualNet','notes'].map(k=>csvEscape(s[k])).join(','))].join('\r\n'));zip.file('README.txt','mbpayday.online local backup. JSON contains all app data. CSV files are for spreadsheet use. Keep this file private.');const blob=await zip.generateAsync({type:'blob'});download(`mbpayday-backup-${today()}.zip`,blob);notify('ZIP backup exported')}catch(e){notify('ZIP export failed. Try JSON export instead.')}}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}if(rows.length<2)return [];const headers=rows.shift().map(x=>x.trim());return rows.filter(r=>r.some(x=>x!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
async function importFile(file){const ext=file.name.toLowerCase().split('.').pop();try{if(ext==='json'){const obj=JSON.parse(await file.text());applyBackup(obj);return}if(ext==='csv'){const rows=parseCSV(await file.text());if(!rows.length)throw Error('No CSV rows found');const normalized=rows.map(x=>({id:x.id||uid(),start:x.start,end:x.end||null,job:x.job||state.settings.jobName,rate:Number(x.rate)||Number(state.settings.hourlyRate),unpaidBreak:Number(x.unpaidBreak)||0,differential:Number(x.differential)||0,notes:x.notes||''}));if(!normalized.every(s=>s.start))throw Error('CSV must include a start column with date/time values');state.shifts.push(...normalized);ensureJobs();save();render();notify(`Imported ${normalized.length} shifts`);return}if(ext==='zip'){if(!window.JSZip)throw Error('ZIP support is unavailable while offline. Import the JSON file instead.');const zip=await JSZip.loadAsync(file);const jf=zip.file('mbpayday-backup.json')||zip.file('mbpaystub-backup.json');if(!jf)throw Error('ZIP does not contain mbpayday-backup.json');applyBackup(JSON.parse(await jf.async('text')));return}throw Error('Choose a JSON, CSV, or ZIP file')}catch(e){notify('Import failed: '+e.message)}}
function applyBackup(obj){if(!obj||!Array.isArray(obj.shifts)||!obj.settings)throw Error('File does not look like an mbpayday.online JSON backup');if(!confirm(`Replace current local data with ${obj.shifts.length} shift(s) and ${(obj.paystubs||[]).length} paystub(s)? Export a backup first if needed.`))return;state={...defaultState(),...obj,settings:{...defaultState().settings,...obj.settings},shifts:obj.shifts,paystubs:Array.isArray(obj.paystubs)?obj.paystubs:[],jobs:Array.isArray(obj.jobs)?obj.jobs:[],activeShift:obj.activeShift||null};ensureJobs();save();editingId=null;page='home';render();notify('Backup imported')}
function tick(){const el=$('#liveClock');if(el){el.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});if(state.activeShift){const sub=el.nextElementSibling;if(sub)sub.textContent=`${dateFmt(today())} · ${state.activeShift.job} · Shift elapsed ${fmtHours(activeHours())}`}}
 if(state.activeShift){const p=shiftPay(state.activeShift),a=state.activeShift,base=(Number(a.rate)||0),diff=Number(a.differential)||0;
  $$('[data-live-earn]').forEach(x=>x.textContent=money(p.gross));
  const r=$('#liveRate');if(r)r.textContent=p.overtime>0?`Overtime: ${money(base*jobCfg(a.job).otMultiplier+diff)}/hr`:`${money(base+diff)}/hr`;
  const hb=$('#headerClock');if(hb)hb.textContent=`■ Clock out · ${money(p.gross)}`}}
$$('.nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;editingId=null;render()}));
$('#quickExport').onclick=exportJSON;$('#headerClock').onclick=toggleClock;$('#themeToggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();tick();setInterval(tick,1000);
})();
</script>
